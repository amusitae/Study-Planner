# Week 8 DEMONSTRATION: nginx load-balancing two copies of the app.
#   docker compose up --build
#   open http://localhost:8080
#
# Demo only: all copies share one SQLite file and each has its own in-memory
# cache. Real scaling would use PostgreSQL/MySQL and Redis/Memcached.
services:
  app1: &app
    build: .
    environment:
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECRET_KEY: "change-me-for-real-use"
      SERVER_NAME: "app1"
    volumes:
      - dbdata:/data
  app2:
    <<: *app
    environment:
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECRET_KEY: "change-me-for-real-use"
      SERVER_NAME: "app2"
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2

volumes:
  dbdata:
