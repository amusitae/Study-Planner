{% extends "base.html" %}
{% block title %}Login · Study Planner{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h1 class="h4 mb-3">Login</h1>
      <form method="post">
        {% csrf_token %}
        {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
        <div class="mb-3">
          <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
          <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
          <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <p class="mt-3 mb-0 small">No account? <a href="{% url 'register' %}">Register</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
